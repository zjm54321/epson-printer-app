name: Build, test, and publish images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep a validated publication intact; newer pending runs replace older pending runs.
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_SOURCE: https://github.com/zjm54321/epson-printer-app

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check static inputs
        run: python3 scripts/check-static.py

      - name: Build runtime once
        run: |
          docker build --pull --platform linux/amd64 --target runtime \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t epson-printer-app:test .

      - name: Build discovery once
        run: |
          docker build --platform linux/amd64 --target discovery \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t epson-printer-discovery:test .

      - name: Test the exact runtime and discovery images
        run: bash scripts/verify-image.sh epson-printer-app:test epson-printer-discovery:test

      - name: Build corresponding-source companion
        run: |
          docker build --platform linux/amd64 --target sources \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t epson-printer-app-sources:test .

      - name: Record built image identities
        run: |
          mkdir -p bundle
          for image in epson-printer-app:test epson-printer-discovery:test epson-printer-app-sources:test; do
            printf '%s %s\n' "$image" "$(docker image inspect --format '{{.Id}}' "$image")"
          done | tee bundle/image-ids.txt
          {
            printf '### Tested build: %s\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat bundle/image-ids.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the images without rebuilding
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker save epson-printer-app:test epson-printer-discovery:test epson-printer-app-sources:test | gzip -1 > bundle/images.tar.gz
          (cd bundle && sha256sum images.tar.gz image-ids.txt > SHA256SUMS)

      - name: Transfer tested images to the publish job
        id: transfer
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record transfer artifact digest
        if: steps.transfer.outcome == 'success'
        env:
          ARTIFACT_DIGEST: ${{ steps.transfer.outputs.artifact-digest }}
        run: |
          printf '\nTransfer artifact SHA-256: %s\n' "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested images from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images-${{ github.sha }}
          path: bundle/

      - name: Verify transfer and load the exact images
        run: |
          (cd bundle && sha256sum --check SHA256SUMS)
          docker load --input bundle/images.tar.gz
          for image in epson-printer-app:test epson-printer-discovery:test epson-printer-app-sources:test; do
            printf '%s %s\n' "$image" "$(docker image inspect --format '{{.Id}}' "$image")"
          done > bundle/loaded-image-ids.txt
          diff -u bundle/image-ids.txt bundle/loaded-image-ids.txt

      - name: Authenticate with the ephemeral workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-auth
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push and verify the same images through authenticated pulls
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-auth
        run: |
          : > bundle/published-images.txt
          for name in epson-printer-app epson-printer-discovery epson-printer-app-sources; do
            local_image="$name:test"
            remote_image="ghcr.io/zjm54321/$name:sha-$GITHUB_SHA"
            expected_id="$(docker image inspect --format '{{.Id}}' "$local_image")"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
            docker pull --platform linux/amd64 "$remote_image"
            actual_id="$(docker image inspect --format '{{.Id}}' "$remote_image")"
            test "$actual_id" = "$expected_id"
            printf '%s\nconfig: %s\n' "$remote_image" "$actual_id" >> bundle/published-images.txt
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$remote_image" \
              | grep -E "^ghcr[.]io/zjm54321/$name@sha256:[0-9a-f]{64}$" >> bundle/published-images.txt
          done
          {
            printf '### Published images (authenticated verification)\n\n```text\n'
            cat bundle/published-images.txt
            printf '```\n\nPackage visibility is separate from repository visibility. Anonymous pulls require a separate release check.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-auth
        run: |
          docker logout ghcr.io
          rm -f -- "$DOCKER_CONFIG/config.json"

      - name: Retain publication evidence (sources are distributed in the OCI companion)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-evidence-${{ github.sha }}
          path: |
            bundle/image-ids.txt
            bundle/published-images.txt
            bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
